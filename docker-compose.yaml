services:
 catalogue:
   build : ./catalogue
   image : taruntejamb/catalogue:1.0.0
   container_name: catalogue
   depends_on:
    - mongodb
 mongodb:
   build: ./mongodb
   image: taruntejamb/mongo:1.0.0
   container_name: mongodb
 redis:
   image: redis:7.0
   container_name: redis
 rabbitmq:
   image : rabbitmq:3   
   environment:
    RABBITMQ_DEFAULT_USER: roboshop
    RABBITMQ_DEFAULT_PASS: roboshop123
   container_name: rabbitmq
 user:
  build : ./user
  image : taruntejamb/user:1.0.0
  container_name: user
  depends_on:
   - mongodb
   - redis 
 cart:
  build : ./cart
  image : taruntejamb/cart:1.0.0
  container_name: cart
  depends_on:
   - redis
   - catalogue
 mysql:
  build : ./mysql
  image : taruntejamb/mysql:1.0.0
  container_name: mysql
 
 shipping:
  build : ./shipping
  image : taruntejamb/shipping:1.0.0
  container_name: shipping
  depends_on:
   - mysql
   - cart

 payment:
  build : ./payment
  image: taruntejamb/payment:1.0.0
  container_name: payment
  environment: 
    - CART_HOST=cart
    - CART_PORT=8080
    - USER_HOST=user
    - USER_PORT=8080
    - AMQP_HOST=rabbitmq
    - AMQP_USER=roboshop
    - AMQP_PASS=roboshop123 

 frontend:
   build : ./frontend
   image: taruntejamb/frontend:1.0.0
   container_name: frontend
   ports:
     - "80:80"
   depends_on:
    - user
    - catalogue
    - cart

networks:
 default:
  name : roboshop
  driver : bridge
  external: false # if true, you need to create network manually

  
 